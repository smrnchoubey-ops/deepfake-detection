version: '3.8'

services:
  deepfake-detector:
    build: .
    ports:
      - "5000:10000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=your-secret-key
      - PORT=10000
    volumes:
      - ./Uploaded_Files:/app/Uploaded_Files
      - ./instance:/app/instance
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
